version: "3.9"

services:
  gol-tube:
    build: .
    container_name: gol-tube
    ports:
      - "5001:5001"
    volumes:
      # Mount the whole project dir so config.json and history.db persist
      # on the host (config.json is created by the app on first run)
      - .:/app
      # Separate named volume for actual downloads (large files)
      - downloads:/downloads
    restart: unless-stopped

volumes:
  downloads:
